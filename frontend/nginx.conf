# Sert l'application Angular et relaie /api vers le backend Spring : le
# navigateur ne parle qu'a une seule origine, donc pas de CORS a configurer.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # "backend" = nom du service dans compose.yaml (resolu par le DNS Docker).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers generes avec un hash dans leur nom : cache long.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routes de l'application (/tasks, /admin/users...) : renvoyer index.html
    # pour que le routeur Angular les prenne en charge, y compris au rechargement.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
