<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/">
    <mat-icon>checklist</mat-icon>
    <span>Todolist</span>
  </a>

  @if (auth.username(); as username) {
    <nav class="nav">
      <a mat-button routerLink="/tasks" routerLinkActive="active">Tâches</a>
      <a mat-button routerLink="/categories" routerLinkActive="active">Catégories</a>
      @if (auth.isAdmin()) {
        <a mat-button routerLink="/admin/users" routerLinkActive="active">Utilisateurs</a>
      }
    </nav>

    <span class="spacer"></span>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
      <mat-icon>account_circle</mat-icon>
      <span class="username">{{ username }}</span>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
      <a mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon>
        <span>Mon profil</span>
      </a>
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        <span>Se déconnecter</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
