<nav class="navbar navbar-expand-md bg-dark mb-4" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Todolist</a>

    <!-- Rien d'autre que le nom de l'application tant que la session n'est pas valide. -->
    @if (auth.isAuthenticated()) {
      <button
        class="navbar-toggler"
        type="button"
        aria-label="Afficher la navigation"
        [attr.aria-expanded]="navOpen()"
        (click)="toggleNav()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" [class.show]="navOpen()">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/tasks" routerLinkActive="active" (click)="closeMenus()">Tâches</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/categories" routerLinkActive="active" (click)="closeMenus()">Catégories</a>
          </li>
          @if (auth.isAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/admin/users" routerLinkActive="active" (click)="closeMenus()">Utilisateurs</a>
            </li>
          }
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <button
              class="nav-link dropdown-toggle"
              type="button"
              [attr.aria-expanded]="userMenuOpen()"
              (click)="toggleUserMenu()"
            >
              {{ auth.username() }}
            </button>
            <!-- data-bs-popper="static" : positionnement CSS de Bootstrap, sans Popper. -->
            <ul class="dropdown-menu dropdown-menu-end" data-bs-popper="static" [class.show]="userMenuOpen()">
              <li><a class="dropdown-item" routerLink="/profile" (click)="closeMenus()">Mon profil</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><button class="dropdown-item" type="button" (click)="logout()">Se déconnecter</button></li>
            </ul>
          </li>
        </ul>
      </div>
    }
  </div>
</nav>

<main class="container pb-5">
  <router-outlet />
</main>

<app-toasts />
