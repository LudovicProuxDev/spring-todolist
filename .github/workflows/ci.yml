name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verifier l'integrite du Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Preparer Gradle (cache des dependances)
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew executable
        run: chmod +x gradlew

      - name: Compiler et assembler le jar (sans executer les tests)
        run: ./gradlew build -x test

      - name: Publier le jar genere
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    # Le demarrage du contexte Spring (contextLoads) a besoin d'une
    # vraie base pour configurer le DataSource JPA/Hibernate.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: todolist
          POSTGRES_USER: todolist
          POSTGRES_PASSWORD: todolist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todolist -d todolist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/todolist
      SPRING_DATASOURCE_USERNAME: todolist
      SPRING_DATASOURCE_PASSWORD: todolist
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparer Gradle (cache des dependances)
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew executable
        run: chmod +x gradlew

      - name: Executer les tests unitaires
        run: ./gradlew test

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/**/*.xml
          retention-days: 7
