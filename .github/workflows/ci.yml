name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Backend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verifier l'integrite du Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Preparer Gradle (cache des dependances)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend

      - name: Rendre gradlew executable
        run: chmod +x gradlew

      - name: Compiler et assembler le jar (sans executer les tests)
        run: ./gradlew build -x test

      - name: Publier le jar genere
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/build/libs/*.jar
          retention-days: 7

  test:
    name: Backend - Tests
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # La base PostgreSQL des tests est demarree par Testcontainers (voir
    # src/test/resources/application.properties) : Docker est disponible sur
    # les runners ubuntu-latest, aucun service n'est a declarer ici.
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparer Gradle (cache des dependances)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend

      - name: Rendre gradlew executable
        run: chmod +x gradlew

      - name: Executer les tests unitaires
        run: ./gradlew test

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/test-results/test/**/*.xml
          retention-days: 7

  frontend:
    name: Frontend - Tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci --no-audit --no-fund

      - name: Executer les tests unitaires
        run: npx ng test --watch=false

      - name: Compiler l'application (production)
        run: npx ng build --configuration production
