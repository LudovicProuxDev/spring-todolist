# Config utilisee pour ./gradlew test en local et en CI.
# Base PostgreSQL ephemere demarree par Testcontainers (URL "jdbc:tc:") : seul
# un demon Docker est requis, aucun port n'est publie sur l'hote, donc pas de
# conflit avec un autre projet utilisant deja 5432.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///todolist
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=update
