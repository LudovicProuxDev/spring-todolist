spring.application.name=spring-todolist

# Generation automatique du schema a partir des entites JPA (pratique en
# developpement). A remplacer par un outil de migration (Flyway/Liquibase)
# avant une mise en production, pour un schema versionne et maitrise.
spring.jpa.hibernate.ddl-auto=update

# Secret de SIGNATURE JWT (cle HMAC encodee en base64) et duree de validite
# des jetons (ici 24h). ATTENTION : cette valeur par defaut n'est qu'un
# secret de developpement commite dans le depot - quiconque le connait peut
# forger des jetons valides. En production, DOIT etre surcharge par la
# variable d'environnement APP_JWT_SECRET (secret genere/stocke a part,
# jamais commite).
app.jwt.secret=RvlnOhFT/W0jODD9KjA/c4I4dyNq2rjZ/XaF+6rTLbpgPYVpNMP0V2ivMCS8Jw8ETK0yGuPqJLfwQmBISVK15Q==
app.jwt.expiration-ms=86400000
