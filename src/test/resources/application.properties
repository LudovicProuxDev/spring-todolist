# Config utilisee pour ./gradlew test en local et en CI.
# Correspond aux identifiants de compose.yaml : "docker compose up -d db" suffit
# pour que les tests s'executent sans variable d'environnement supplementaire.
# En CI, les variables SPRING_DATASOURCE_* du job surchargent ces valeurs.
spring.datasource.url=jdbc:postgresql://localhost:5432/todolist
spring.datasource.username=todolist
spring.datasource.password=todolist
spring.jpa.hibernate.ddl-auto=update
