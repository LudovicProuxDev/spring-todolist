services:
  frontend:
    build:
      context: ./frontend
    # Application Angular servie par nginx, qui relaie /api vers le backend.
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # Publie pour l'acces direct a l'API et a Swagger UI ; le front passe par nginx.
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-todolist}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-todolist}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-todolist}
      # Obligatoire : pas de repli sur le secret de dev d'application.properties.
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET doit etre defini (voir .env.example)}
      # Optionnels : compte administrateur cree au demarrage s'il n'existe pas.
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    # Pret quand l'API repond (endpoint public, sans effet de bord).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/categories"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todolist}
      POSTGRES_USER: ${POSTGRES_USER:-todolist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todolist}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todolist} -d ${POSTGRES_DB:-todolist}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
